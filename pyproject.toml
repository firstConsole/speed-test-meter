[project]
name = "speed-test-meter"
version = "0.1.0"
description = "Measures internet download speed by timing sequential HTTP requests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "firstConsole", email = "artamonov008@yandex.ru" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/firstConsole/speed-test-meter"

[project.scripts]
speedmeter = "speedmeter.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16.7,<0.17",
    "mypy>=2.3,<3",
]

[tool.poetry]
requires-poetry = ">=2.2"
packages = [{ include = "speedmeter", from = "src" }]

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
#  Ruff — линтер и форматтер
# =============================================================================

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "ERA",  # eradicate
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "G",    # flake8-logging-format
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint (C/E/R/W)
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

extend-select = [
    "D400",
    "D401",
]

ignore = [
    # Несовместимо с ruff format
    "ISC001",
]
# S310 намеренно не гасится глобально: подавление стоит точечно в адаптере,
# рядом с валидацией схемы. Глобальный ignore и локальный noqa
# взаимоисключающи — второй превратился бы в RUF100.

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["speedmeter"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
exclude = ["*.md"]

# =============================================================================
#  Mypy — статическая проверка типов
# =============================================================================

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
warn_unused_configs = true
strict = true
warn_unreachable = true

enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "deprecated",
    "mutable-override",
]

pretty = true

# =============================================================================
#  Pytest
# =============================================================================

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--showlocals",
]

markers = [
    "network: test that opens a real socket (deselect with -m 'not network').",
]

filterwarnings = ["error"]
xfail_strict = true
